<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ordena los numeros</title>
</head>
<body>
    <h1>Organizador de números</h1>
    <div class="caja">
        <input type="number" id="num1" class="inpNumero" placeholder="Número" >
        <input type="number" id="num2" class="inpNumero" placeholder="Número" >
        <input type="number" id="num3" class="inpNumero" placeholder="Número" >
        <button type="button" id="btnOrdenar">Ordenar</button>
    </div>
    <h2 id="text"></h2>
    <h2>Orden de mayor a menor</h2>
    <div class="caja">
        <div class="cajas" id="mayor"></div>
        <div class="cajas" id="medio"></div>
        <div class="cajas" id="menor"></div>
    </div>
    <h2>Orden de menor a mayor</h2>
    <div class="caja">
        <div class="cajas" id="menor2"></div>
        <div class="cajas" id="medio2"></div>
        <div class="cajas" id="mayor2"></div>
    </div>
</body>
<script type="module" src="script.js"></script>
</html>
